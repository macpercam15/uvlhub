name: Deploy to Render

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Deploy to Rende
        env:
          deploy_url: ${{ secrets.RENDER }}
        run: |
          curl "$deploy_url"